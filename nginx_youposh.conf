server {
    server_name youposhmaroc.com www.youposhmaroc.com;
    root /var/www/youposh/dist;
    index index.html;
    client_max_body_size 50M;

    # ── Gzip Compression ──────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        image/svg+xml;

    # ── Images uploadées : servies directement depuis le disque ──
    # (Bypass total du backend = ultra rapide)
    location /uploads/ {
        alias /var/www/youposh/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Vary Accept-Encoding;
        access_log off;
        gzip_static on;
    }

    # ── Proxy /api/ vers le backend Express ──────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;

        # Buffer les réponses pour éviter les timeouts sur réseau lent
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }

    # ── Assets JS/CSS (noms hachés = cache long terme) ───────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary Accept-Encoding;
        access_log off;
        gzip_static on;
    }

    # ── index.html : jamais en cache (SPA routing) ───────────────
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # ── SPA fallback ─────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/youposhmaroc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/youposhmaroc.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    keepalive_timeout 65;
}

server {
    listen 80;
    server_name youposhmaroc.com www.youposhmaroc.com;
    return 301 https://$host$request_uri;
}
